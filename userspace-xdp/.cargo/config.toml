[build]
target = "bpfel-unknown-none"

[target.bpfel-unknown-none]
# PATH-resolved (#1864): build-userspace-xdp.sh prepends ~/.cargo/bin
# and version-checks this exact binary against its pin before building.
# Do not hardcode an absolute path here — the script's check and the
# binary cargo executes must be the same file.
linker = "bpf-linker"

[unstable]
build-std = ["core"]
