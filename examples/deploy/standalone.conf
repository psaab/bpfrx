/* xpf standalone starter config (#1879).
 *
 * NIC order at VM creation = interface names here:
 *   NIC #1 -> fxp0     management, DHCP
 *   NIC #2 -> ge-0/0/0 LAN  (192.168.1.1/24, DHCP server for clients)
 *   NIC #3 -> ge-0/0/1 WAN  (DHCP from upstream)
 *
 * Launch (incus):
 *   scripts/deploy/xpf-deploy.py launch --name fw1 --config standalone.conf \
 *       --nic bridge:br-mgmt --nic bridge:br-lan --nic bridge:br-wan
 * or via YAML: scripts/deploy/xpf-deploy.py examples/deploy/standalone.yaml
 *
 * Replace credentials/addressing before production use. Validate any
 * edit with:  xpfd check-config standalone.conf
 */
interfaces {
    fxp0 {
        unit 0 { family inet { dhcp; } }
    }
    ge-0/0/0 {
        unit 0 {
            family inet { address 192.168.1.1/24; }
        }
    }
    ge-0/0/1 {
        unit 0 { family inet { dhcp; } }
    }
}
security {
    zones {
        security-zone mgmt {
            interfaces { fxp0; }
            host-inbound-traffic { system-services { ssh; ping; } }
        }
        security-zone lan {
            interfaces { ge-0/0/0.0; }
            host-inbound-traffic { system-services { ssh; ping; dhcp; } }
        }
        security-zone wan {
            interfaces { ge-0/0/1.0; }
            host-inbound-traffic { system-services { dhcp; ping; } }
        }
    }
    policies {
        default-policy deny-all;
        from-zone lan to-zone wan {
            policy allow-out {
                match { source-address any; destination-address any; application any; }
                then { permit; }
            }
        }
    }
    nat {
        source {
            rule-set lan-to-wan {
                from zone lan;
                to zone wan;
                rule snat {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { interface; } }
                }
            }
        }
    }
}
system {
    host-name xpf-fw1;
    name-server {
        1.1.1.1;
        9.9.9.9;
    }
    services {
        dhcp-local-server {
            group lan-pool {
                interface ge-0/0/0.0;
                pool lan-range {
                    subnet 192.168.1.0/24;
                    address-range low 192.168.1.100 high 192.168.1.199;
                    router 192.168.1.1;
                    dns-server 1.1.1.1;
                }
            }
        }
    }
    dataplane-type userspace;
}
