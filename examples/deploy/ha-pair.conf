/* xpf HA-pair starter config (#1879). ONE file deploys BOTH nodes —
 * only the node-id on the day-0 drive differs (-n 0 / -n 1); the
 * groups node0/node1 + apply-groups "${node}" machinery does the rest,
 * exactly like vSRX.
 *
 * NIC order at VM creation (IDENTICAL on both VMs) = names here:
 *   NIC #1 -> fxp0       management, DHCP
 *   NIC #2 -> em0        HA control link  (point-to-point, both nodes)
 *   NIC #3 -> ge-X/0/0   fabric link      (point-to-point, both nodes)
 *   NIC #4 -> ge-X/0/1   LAN  -> reth1
 *   NIC #5 -> ge-X/0/2   WAN  -> reth0
 * where X = 0 on node 0 and X = 7 on node 1 (vSRX FPC convention —
 * the same physical port has two per-node names; that is why every
 * reth member and interface-monitor entry below appears twice).
 *
 * Launch (incus) — see docs/deploy-quickstart.md for the network setup:
 *   scripts/deploy/xpf-launch.sh --name fw0 --node-id 0 --conf ha-pair.conf \
 *       --nic net:mgmt --nic net:ha-control --nic net:ha-fabric \
 *       --nic bridge:br-lan --nic bridge:br-wan
 *   scripts/deploy/xpf-launch.sh --name fw1 --node-id 1 --conf ha-pair.conf \
 *       --nic net:mgmt --nic net:ha-control --nic net:ha-fabric \
 *       --nic bridge:br-lan --nic bridge:br-wan
 *
 * Validate both personalities before shipping:
 *   xpfd check-config -node-id 0 ha-pair.conf
 *   xpfd check-config -node-id 1 ha-pair.conf
 */
groups {
    node0 {
        system { host-name xpf-fw0; }
        chassis {
            cluster {
                node 0;
                peer-address 10.255.0.2;
                fabric-peer-address 10.255.1.2;
            }
        }
        interfaces {
            fxp0 { unit 0 { family inet { dhcp; } } }
            em0  { unit 0 { family inet { address 10.255.0.1/30; } } }
            fab0 { unit 0 { family inet { address 10.255.1.1/30; } } }
            ge-0/0/1 { gigether-options { redundant-parent reth1; } }
            ge-0/0/2 { gigether-options { redundant-parent reth0; } }
        }
    }
    node1 {
        system { host-name xpf-fw1; }
        chassis {
            cluster {
                node 1;
                peer-address 10.255.0.1;
                fabric-peer-address 10.255.1.1;
            }
        }
        interfaces {
            fxp0 { unit 0 { family inet { dhcp; } } }
            em0  { unit 0 { family inet { address 10.255.0.2/30; } } }
            fab1 { unit 0 { family inet { address 10.255.1.2/30; } } }
            ge-7/0/1 { gigether-options { redundant-parent reth1; } }
            ge-7/0/2 { gigether-options { redundant-parent reth0; } }
        }
    }
}
apply-groups "${node}";
chassis {
    cluster {
        cluster-id 1;
        reth-count 2;
        heartbeat-interval 200;
        heartbeat-threshold 5;
        control-interface em0;
        configuration-synchronize;
        redundancy-group 0 {
            node 0 priority 200;
            node 1 priority 100;
        }
        redundancy-group 1 {
            node 0 priority 200;
            node 1 priority 100;
            gratuitous-arp-count 8;
            interface-monitor {
                ge-0/0/2 weight 255;
                ge-7/0/2 weight 255;
            }
        }
        redundancy-group 2 {
            node 0 priority 200;
            node 1 priority 100;
            gratuitous-arp-count 8;
            interface-monitor {
                ge-0/0/1 weight 255;
                ge-7/0/1 weight 255;
            }
        }
    }
}
interfaces {
    fab0 {
        fabric-options { member-interfaces { ge-0/0/0; } }
    }
    fab1 {
        fabric-options { member-interfaces { ge-7/0/0; } }
    }
    reth0 {
        redundant-ether-options { redundancy-group 1; }
        unit 0 {
            family inet { address 203.0.113.2/24; }
        }
    }
    reth1 {
        redundant-ether-options { redundancy-group 2; }
        unit 0 {
            family inet { address 192.168.1.1/24; }
        }
    }
}
security {
    zones {
        security-zone mgmt {
            interfaces { fxp0; }
            host-inbound-traffic { system-services { ssh; ping; } }
        }
        security-zone control {
            interfaces { em0; fab0; fab1; }
            host-inbound-traffic { system-services { all; } }
        }
        security-zone lan {
            interfaces { reth1.0; }
            host-inbound-traffic { system-services { ssh; ping; dhcp; } }
        }
        security-zone wan {
            interfaces { reth0.0; }
            host-inbound-traffic { system-services { ping; } }
        }
    }
    policies {
        default-policy deny-all;
        from-zone lan to-zone wan {
            policy allow-out {
                match { source-address any; destination-address any; application any; }
                then { permit; }
            }
        }
    }
    nat {
        source {
            rule-set lan-to-wan {
                from zone lan;
                to zone wan;
                rule snat {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { interface; } }
                }
            }
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 { next-hop 203.0.113.1; }
    }
}
system {
    name-server {
        1.1.1.1;
        9.9.9.9;
    }
    dataplane-type userspace;
}
